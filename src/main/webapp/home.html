<!DOCTYPE html>
<html>
<head>
    <title>Mood Music App</title>
    <script>
        async function searchSongs() {
          const query = document.getElementById("query").value;
          const res = await fetch("mood?query=" + query);
          const data = await res.json();
          const container = document.getElementById("results");
          container.innerHTML = "";

          if (data.tracks && data.tracks.items) {
            data.tracks.items.forEach(track => {
              const div = document.createElement("div");
              div.innerHTML = `
                <p><b>${track.name}</b> by ${track.artists[0].name}
                  <a href="${track.external_urls.spotify}" target="_blank">Play</a>
                  <button onclick="favoriteSong('${track.name}', '${track.artists[0].name}', '${track.external_urls.spotify}')">❤️</button>
                </p>`;
              container.appendChild(div);
            });
          } else {
            container.innerHTML = "<p>No results</p>";
          }
        }

        async function favoriteSong(song, artist, url) {
          const formData = new URLSearchParams();
          formData.append("song", song);
          formData.append("artist", artist);
          formData.append("url", url);

          const res = await fetch("favorite", {
            method: "POST",
            body: formData
          });

          alert(await res.text());
        }
    </script>
</head>
<body>
<h2>Welcome to Mood Music App 🎶</h2>
<input type="text" id="query" placeholder="Search songs...">
<button onclick="searchSongs()">Search</button>
<div id="results"></div>
</body>
</html>
