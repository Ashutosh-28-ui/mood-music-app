<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Mood Music App</title>

    <style>
        body {
            font-family: Arial;
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1db954;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #17a74a;
        }

        a {
            color: #1db954;
        }

        #error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🎶 Login</h2>

    <form method="post" action="login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>No account? <a href="signup.html">Signup here</a></p>

    <!-- Optional error message -->
    <div id="error">
        <!-- You can show errors here later -->
    </div>

</div>
<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
        document.getElementById("error").innerText = "Invalid username or password";
    }
</script>
</body>
</html>
