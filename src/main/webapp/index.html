<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mood Music App</title>
</head>
<body>

<h1>Mood Music App</h1>

<!-- SEARCH -->
<form action="getSongs" method="get">
    <select name="mood">
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="angry">Angry</option>
    </select>
    <button type="submit">Get Songs</button>
</form>

<br>

<!-- MOOD -->
<form action="mood" method="get">
    <select name="mood">
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="angry">Angry</option>
    </select>
    <button type="submit">Get Songs</button>
</form>

<form action="search" method="get">
    <input type="text" name="query" placeholder="Search songs..." required>
    <button type="submit">Search</button>
</form>
</body>
</html>
